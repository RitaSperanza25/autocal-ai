<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCal AI</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .auth-section {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      resize: none;
      font-family: inherit;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }
    button.send-btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.send-btn:hover {
      background-color: var(--primary-hover);
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AutoCal AI</h1>
    <p>Pianifica i tuoi eventi su Google Calendar inserendo frasi in linguaggio naturale.</p>

    <div class="auth-section">
      <div id="g_id_onload"
           data-client_id="889306807585-ht7iah8qkpg0gj74id9qlv6st0bkre4p.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>

    <textarea id="prompt" placeholder="Es: Riunione di lavoro domani alle 15:00 con Marco..."></textarea>
    <button class="send-btn" onclick="sendToAI()">Crea Evento</button>

    <div id="status"></div>
  </div>

  <script>
    let userToken = null;
    const BACKEND_URL = 'https://autocal-backend.onrender.com';

    function handleCredentialResponse(response) {
      userToken = response.credential;
      document.getElementById('status').innerText = 'Accesso effettuato con successo!';
      document.getElementById('status').style.color = 'green';
    }

    async function sendToAI() {
      const promptText = document.getElementById('prompt').value;
      const statusDiv = document.getElementById('status');

      if (!promptText) {
        statusDiv.innerText = 'Inserisci un testo prima di inviare.';
        statusDiv.style.color = 'red';
        return;
      }

      statusDiv.innerText = 'Elaborazione in corso... (potrebbe richiedere qualche secondo)';
      statusDiv.style.color = 'blue';

      try {
        const res = await fetch(`${BACKEND_URL}/api/parse-event`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText, token: userToken })
        });
        const data = await res.json();
        
        if (res.ok) {
          statusDiv.innerText = 'Evento creato con successo su Google Calendar!';
          statusDiv.style.color = 'green';
          document.getElementById('prompt').value = '';
        } else {
          statusDiv.innerText = `Errore: ${data.message || 'Impossibile creare l\'evento.'}`;
          statusDiv.style.color = 'red';
        }
      } catch (err) {
        statusDiv.innerText = 'Errore di connessione al backend.';
        statusDiv.style.color = 'red';
      }
    }
  </script>

</body>
</html>
